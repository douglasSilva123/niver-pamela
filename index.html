<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presente Especial para Pâmela</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <div class="container">
        <div class="message">
            <h1>Pâmela, clique no presente especial!</h1>
            <div class="stars">
                <div class="star">✧</div>
                <div class="star">✦</div>
                <div class="star">✧</div>
            </div>
        </div>
        
        <div class="gift-box" id="giftBox">
            <img src="assets/images/16832762.png" alt="Presente fechado" class="closed" >
            <img src="assets/images/16832813.png" alt="Presente aberto" class="open">
        </div>
        
        <div class="hidden-message" id="hiddenMessage">
            <h2>Feliz Aniversário!</h2>
            <p>Preparei algo especial para você...</p>
        </div>
    </div>

    <script src="scripts/main.js"></script>
</body>
</html>
